<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZirveOS</title>
<style>
:root{color-scheme:dark;--acc:#0a84d6;--tb:rgba(20,24,32,.92);--win:#fff;--tx:#1b1f27;--bar:#f3f5f8}
*{box-sizing:border-box;margin:0;user-select:none}
html,body{height:100%;overflow:hidden;background:#06121f;font-family:"Segoe UI",system-ui,Arial,sans-serif;color:#fff}
#boot,#login{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#06121f;z-index:900}
.logo{font-size:44px;font-weight:300;letter-spacing:6px}
.logo b{color:var(--acc);font-weight:700}
.spin{width:34px;height:34px;border:3px solid #25384d;border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes dr{to{stroke-dashoffset:0}}
#boot .logo{opacity:0;animation:pop .9s ease-out .8s forwards}
.mark{width:min(240px,70vw);height:auto;opacity:0;animation:pop .9s ease-out .2s forwards}
@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.mark{animation-duration:.01s!important;animation-delay:0s!important}}
#login{display:none;background:radial-gradient(circle at 30% 20%,#0f4c81,#06121f 70%)}
.av{width:110px;height:110px;border-radius:50%;background:#1d6fb0;display:grid;place-items:center;font-size:48px}
#login input{padding:9px 12px;width:240px;border:0;border-bottom:2px solid var(--acc);background:rgba(255,255,255,.12);color:#fff;font-size:15px;user-select:text}
#login button{padding:9px 28px;border:0;background:var(--acc);color:#fff;font-size:15px;cursor:pointer}
#desk{position:fixed;inset:0 0 48px 0;background:linear-gradient(135deg,#0b3a6b,#0a84d6 55%,#6cc3f5);background-size:cover}
.ic{position:absolute;width:80px;padding:6px 2px;text-align:center;font-size:12px;cursor:default;border:1px solid transparent;text-shadow:0 1px 3px #000}
.ic:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3)}
.ic i{display:block;font-style:normal;font-size:34px;margin-bottom:3px}
#tb{position:fixed;left:0;right:0;bottom:0;height:48px;background:var(--tb);display:flex;align-items:center;z-index:800;backdrop-filter:blur(14px);padding-bottom:env(safe-area-inset-bottom,0px)}
#tb button{height:48px;min-width:48px;border:0;background:none;color:#fff;font-size:18px;cursor:pointer;padding:0 12px;border-bottom:3px solid transparent}
#tb button:hover{background:rgba(255,255,255,.12)}
#tb button.on{border-bottom-color:var(--acc);background:rgba(255,255,255,.08)}
#tb button.min{opacity:.6}
#tasks{display:flex;flex:1;overflow:hidden}
#tasks button{font-size:13px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clock{text-align:right;font-size:12px;padding:0 12px;line-height:1.25;cursor:default}
#start{position:fixed;left:0;bottom:48px;width:min(560px,100vw);height:min(520px,calc(100% - 60px));background:rgba(24,28,38,.97);display:none;z-index:850;backdrop-filter:blur(16px)}
#start.open{display:flex}
#side{width:48px;display:flex;flex-direction:column;justify-content:flex-end}
#side button{height:48px;border:0;background:none;color:#fff;font-size:18px;cursor:pointer}
#side button:hover{background:rgba(255,255,255,.12)}
#list{width:220px;overflow:auto;padding:10px 0}
#list div{padding:9px 14px;font-size:14px;cursor:pointer}
#list div:hover,.tile:hover{background:rgba(255,255,255,.12)}
#tiles{overflow:auto;flex:1;padding:14px;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:110px;gap:6px;align-content:start}
.tile{background:var(--acc);padding:10px;font-size:13px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}
.tile i{font-style:normal;font-size:32px}
.win{position:absolute;background:var(--win);color:var(--tx);box-shadow:0 8px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;min-width:260px;min-height:160px;border:1px solid #2a6fa8}
.win.max{inset:0 0 48px 0!important;width:auto!important;height:auto!important}
.th{height:34px;background:var(--bar);display:flex;align-items:center;padding-left:10px;font-size:13px;cursor:default;flex:none}
.th span{flex:1;overflow:hidden;white-space:nowrap}
.th button{width:44px;height:34px;border:0;background:none;color:var(--tx);font-size:14px;cursor:pointer}
.th button:hover{background:#dfe3ea}.th button.x:hover{background:#e81123;color:#fff}
.body{flex:1;overflow:auto;position:relative;user-select:text}
.body textarea{width:100%;height:100%;border:0;padding:10px;font:14px Consolas,monospace;resize:none;outline:0;color:var(--tx);background:#fff}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:4px;background:#e8ebf0;height:100%}
.calc .d{grid-column:span 4;background:#fff;text-align:right;font-size:30px;padding:14px 10px;overflow:hidden}
.calc button{border:0;background:#f7f8fa;font-size:18px;cursor:pointer;color:var(--tx)}
.calc button:hover{background:#d7dde7}.calc .o{background:#e3eaf4}.calc .e{background:var(--acc);color:#fff}
.fx{display:flex;height:100%}
.fx aside{width:150px;background:#f3f5f8;padding:8px 0;font-size:13px}
.fx aside div{padding:7px 14px;cursor:pointer}.fx aside div:hover,.fx aside .a{background:#cfe4f7}
.fx main{flex:1;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,90px);gap:8px;align-content:start;font-size:12px;text-align:center}
.fx main div{padding:6px;cursor:default}.fx main div:hover{background:#e3effb}.fx main i{display:block;font-style:normal;font-size:34px}
.set{padding:18px;font-size:14px}.set h3{margin:0 0 10px;font-weight:600}
.wp{display:inline-block;width:92px;height:56px;margin:0 8px 8px 0;border:2px solid transparent;cursor:pointer}
.wp:hover{border-color:var(--acc)}
.term{background:#0c0c0c;color:#d7ffd7;font:13px Consolas,monospace;padding:10px;height:100%;overflow:auto}
.term input{background:none;border:0;outline:0;color:#d7ffd7;font:inherit;width:70%;user-select:text}
#toast{position:fixed;right:14px;bottom:60px;background:#1f2937;padding:12px 16px;font-size:13px;border-left:4px solid var(--acc);display:none;z-index:950}
#setup{position:fixed;inset:0;z-index:1000;background:linear-gradient(135deg,#0b1522,#14283f);display:flex;align-items:center;justify-content:center;padding:12px}
.sw{width:min(640px,100%);min-height:380px;background:#0f1b2a;border:1px solid #27425e;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sh{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid #27425e}.sh img{height:36px}.sh h2{font-size:18px;font-weight:400}
#su-body{flex:1;padding:22px 24px;font-size:14px;line-height:1.55;user-select:text}
#su-body select{padding:7px;background:#16293d;color:#fff;border:1px solid #27425e;margin:4px 0 12px;min-width:240px}
.lic{height:150px;overflow:auto;border:1px solid #27425e;padding:10px;margin-bottom:12px;font-size:13px;color:#b8c7d8}
.dk{display:block;padding:10px 12px;border:1px solid #27425e;margin:6px 0;cursor:pointer}.dk:hover{border-color:var(--acc)}
.bar{height:8px;background:#1b2f45;margin:14px 0 6px}.bar i{display:block;height:100%;width:0;background:var(--acc)}
.sf{padding:14px 20px;text-align:right;border-top:1px solid #27425e}
#su-next{padding:9px 30px;border:0;background:var(--acc);color:#fff;font-size:14px;cursor:pointer}
/* hızlı ayarlar paneli */
#qs{font-size:14px!important;letter-spacing:3px;padding:0 10px!important}
#qp{position:fixed;right:10px;bottom:58px;width:min(360px,calc(100vw - 20px));background:rgba(32,36,46,.97);color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.55);z-index:850;display:none;backdrop-filter:blur(16px);overflow:hidden;animation:up .18s ease-out}
#qp.open{display:block}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px;padding:16px 16px 12px}
.qc{display:flex;flex-direction:column;gap:6px;font-size:12px;text-align:center}
.qc span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.qt{display:flex;height:46px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:5px;overflow:hidden}
.qt button{border:0;background:none;color:inherit;cursor:pointer;font-size:18px;flex:1}
.qt button.a{flex:0 0 38px;font-size:18px;border-left:1px solid rgba(255,255,255,.14)}
.qt button:hover{background:rgba(255,255,255,.1)}
.qc.on .qt{background:var(--acc);border-color:var(--acc)}
.qc.on .qt button:hover{background:rgba(255,255,255,.2)}
.qsl{display:flex;align-items:center;gap:10px;padding:8px 18px}
.qsl button{border:0;background:none;color:#fff;font-size:17px;width:26px;cursor:pointer;padding:0}
.qsl input{flex:1;accent-color:var(--acc);cursor:pointer}
.qsl em{width:38px;text-align:right;font-style:normal;font-size:12px;color:#9fb3c8}
#qf{display:flex;align-items:center;justify-content:space-between;padding:8px 18px;background:rgba(0,0,0,.2);font-size:13px;margin-top:8px}
#qf button{border:0;background:none;color:#fff;font-size:17px;cursor:pointer;padding:4px 8px}
#qf button:hover{background:rgba(255,255,255,.12)}
#qsub{display:none;padding:12px 8px 14px}
.qh{display:flex;align-items:center;gap:8px;padding:2px 8px 10px;font-size:15px}
.qh button{border:0;background:none;color:#fff;font-size:18px;cursor:pointer;padding:2px 8px}
.qh button:hover{background:rgba(255,255,255,.12)}
.qr{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;font-size:13px;cursor:pointer;border-radius:4px}
.qr:hover{background:rgba(255,255,255,.1)}
.qr.dim{color:#9fb3c8;cursor:default}.qr.dim:hover{background:none}
.qk{display:inline-block;width:36px;height:18px;border-radius:9px;background:#56606e;position:relative;flex:none}
.qk::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .15s}
.qk.on{background:var(--acc)}.qk.on::after{left:21px}
#bright{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:1100}
html.eco *,html.rm *{animation:none!important;transition:none!important}
html.eco #tb,html.eco #start,html.eco #qp{backdrop-filter:none}
html.hc{filter:contrast(1.25)}
html.big .win .body{zoom:1.2}
html.big #list,html.big #tiles{zoom:1.12}
</style>
</head>
<body>
<div id="setup"><div class="sw"><div class="sh"><img alt=""><h2 id="su-title"></h2></div><div id="su-body"></div><div class="sf"><button id="su-next"></button></div></div></div>

<div class="logo">Zirve<b>OS</b></div><div class="spin"></div></div>
<div id="login">
  <div class="av">☺</div><div style="font-size:24px">Kullanıcı</div>
  <input id="pw" type="password" placeholder="Parola">
  <button id="go">Oturum aç</button>
</div>
<div id="desk"></div>
<div id="start">
  <div id="side"><button title="Kapat" onclick="location.reload()">⏻</button></div>
  <div id="list"></div>
  <div id="tiles"></div>
</div>
<div id="tb">
  <button id="sb">⊞</button>
  <div id="tasks"></div>
  <button id="qs" title="Hızlı ayarlar"><span id="qi">📶 🔊 🔋</span></button>
  <div id="clock"></div>
</div>
<div id="toast"></div>
<div id="qp"></div>
<div id="bright"></div>
<script>
const $=s=>document.querySelector(s);
const APPS={
  notepad:{n:"Not Defteri",i:"📝",w:480,h:340},
  calc:{n:"Hesap Makinesi",i:"🧮",w:300,h:400},
  files:{n:"Dosya Gezgini",i:"📁",w:560,h:380},
  settings:{n:"Ayarlar",i:"⚙️",w:480,h:340},control:{n:"Denetim Masası",i:"🛠️",w:540,h:430},
  term:{n:"Komut İstemi",i:"⌨️",w:540,h:340},
  browser:{n:"Zirve Tarayıcı",i:"🌐",w:640,h:420},paint:{n:"Boya",i:"🎨",w:560,h:420},taskmgr:{n:"Görev Yöneticisi",i:"📊",w:420,h:320},snake:{n:"Yılan Oyunu",i:"🐍",w:340,h:420},cal:{n:"Takvim & Zamanlayıcı",i:"📅",w:360,h:400},media:{n:"Medya Oynatıcı",i:"🎵",w:480,h:340},piano:{n:"Piyano",i:"🎹",w:520,h:200},trash:{n:"Geri Dönüşüm Kutusu",i:"🗑️",w:360,h:240},
  about:{n:"ZirveOS Hakkında",i:"ℹ️",w:360,h:220}
};
const WALLS=[
  ["linear-gradient(135deg,#0b3a6b,#0a84d6 55%,#6cc3f5)"],
  ["linear-gradient(135deg,#1a0b3a,#7b2ff7 60%,#f107a3)"],
  ["linear-gradient(135deg,#052e1f,#0f9d58 60%,#b7f5c9)"],
  ["linear-gradient(135deg,#2b1308,#e8590c 60%,#ffd8a8)"],
  ["linear-gradient(135deg,#111,#444 60%,#999)"]
];
let z=10,wins={},topId=null,n=0;

/* açılış */
setTimeout(()=>{$("#boot").style.display="none";$("#login").style.display="flex"},2200);
function login(){let sp="";try{sp=localStorage.getItem("zirve_pw")||""}catch(e){}if(sp&&$("#pw").value!==sp){toast("Yanlış parola");$("#pw").value="";return}$("#pw").value="";$("#login").style.display="none";toast("ZirveOS’a hoş geldin!")}
$("#go").onclick=login;$("#pw").onkeydown=e=>{if(e.key==="Enter")login()};

/* masaüstü simgeleri */
Object.keys(APPS).slice(0,9).forEach((k,idx)=>{
  const d=document.createElement("div");d.className="ic";
  d.style.left=(12+Math.floor(idx/6)*92)+"px";d.style.top=(12+(idx%6)*92)+"px";
  d.innerHTML=`<i>${APPS[k].i}</i>${APPS[k].n}`;
  d.ondblclick=()=>openApp(k);
  d.onclick=()=>{if(matchMedia("(pointer:coarse)").matches)openApp(k)};
  $("#desk").appendChild(d);
});

/* başlat menüsü */
Object.keys(APPS).forEach(k=>{
  const a=document.createElement("div");a.textContent=APPS[k].i+"  "+APPS[k].n;
  a.onclick=()=>{openApp(k);toggleStart(false)};$("#list").appendChild(a);
  if(k!=="about"){
    const t=document.createElement("div");t.className="tile";
    t.innerHTML=`<i>${APPS[k].i}</i>${APPS[k].n}`;
    t.onclick=()=>{openApp(k);toggleStart(false)};$("#tiles").appendChild(t);
  }
});
function toggleStart(v){const s=$("#start");const o=v===undefined?!s.classList.contains("open"):v;s.classList.toggle("open",o);$("#sb").classList.toggle("on",o)}
$("#sb").onclick=e=>{e.stopPropagation();toggleStart()};
$("#desk").onclick=()=>toggleStart(false);

/* saat */
function tick(){const d=new Date();$("#clock").innerHTML=d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})+"<br>"+d.toLocaleDateString("tr-TR")}
tick();setInterval(tick,10000);
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",2600)}

/* pencere yöneticisi */
function openApp(k){
  const a=APPS[k],id="w"+(++n);
  const w=document.createElement("div");w.className="win";
  const W=Math.min(a.w,innerWidth-10),H=Math.min(a.h,innerHeight-70);
  w.style.cssText=`width:${W}px;height:${H}px;left:${Math.max(0,60+(n%6)*28)}px;top:${20+(n%6)*28}px`;
  w.innerHTML=`<div class="th"><span>${a.i} ${a.n}</span><button class="m">–</button><button class="mx">▢</button><button class="x">✕</button></div><div class="body"></div>`;
  $("#desk").appendChild(w);
  const tbtn=document.createElement("button");tbtn.textContent=a.i+" "+a.n;$("#tasks").appendChild(tbtn);
  wins[id]={w,tbtn,min:false};
  build(k,w.querySelector(".body"));
  const focus=()=>{w.style.zIndex=++z;topId=id;refresh()};
  w.onmousedown=focus;w.ontouchstart=focus;
  tbtn.onclick=()=>{const o=wins[id];if(o.min){o.min=false;w.style.display="flex";focus()}else if(topId===id){o.min=true;w.style.display="none";refresh()}else focus()};
  w.querySelector(".m").onclick=()=>{wins[id].min=true;w.style.display="none";refresh()};
  w.querySelector(".mx").onclick=()=>w.classList.toggle("max");
  w.querySelector(".x").onclick=()=>{w.remove();tbtn.remove();delete wins[id]};
  const th=w.querySelector(".th");
  th.ondblclick=()=>w.classList.toggle("max");
  drag(th,w);focus();
}
function refresh(){for(const id in wins){wins[id].tbtn.className=(id===topId&&!wins[id].min)?"on":(wins[id].min?"min":"")}}
function drag(h,w){
  h.onpointerdown=e=>{
    if(e.target.tagName==="BUTTON"||w.classList.contains("max"))return;
    const dx=e.clientX-w.offsetLeft,dy=e.clientY-w.offsetTop;h.setPointerCapture(e.pointerId);

      pane.innerHTML=h;const rb=E("button",st.wifi_on?"Wi-Fi'yi kapat":"Wi-Fi'yi aç");rb.style.cssText="padding:5px 12px;margin-bottom:8px";rb.onclick=async()=>{await api("/api/wifi/radio",{on:!st.wifi_on});setTimeout(net,1500)};pane.appendChild(rb);
      if(!st.wifi_on)return;const ls=E("div","Ağlar taranıyor...");pane.appendChild(ls);

        r.onclick=async()=>{let pw="";if(n.sec&&!n.active){pw=prompt(n.ssid+" parolası:");if(pw===null)return}toast("Bağlanılıyor...");const x=await api("/api/wifi/connect",{ssid:n.ssid,password:pw});toast(x&&x.ok?"Bağlandı: "+n.ssid:"Bağlanılamadı");net()};ls.appendChild(r)})};
    const snd=async()=>{const st=await api("/api/status");if(!st)return off();

      const ss=pane.querySelector("#ss"),sm=pane.querySelector("#sm"),sv=pane.querySelector("#sv");ss.value=st.volume??50;sm.checked=!!st.muted;sv.textContent="%"+ss.value;
      const send=()=>{sv.textContent="%"+ss.value;api("/api/volume",{v:+ss.value,mute:sm.checked})};ss.oninput=send;sm.onchange=send};
    const disp=()=>{pane.innerHTML="<h3>Görüntü</h3><p>Parlaklık (ekran karartma):</p><input id='bb' type='range' min='20' max='100' style='width:100%'>";const q=$("#qbr"),bb=pane.querySelector("#bb");bb.value=q.value;bb.oninput=()=>{q.value=bb.value;q.dispatchEvent(new Event("input"))}};
    const sys=async()=>{const st=await api("/api/status");pane.innerHTML="<h3>Sistem</h3><p>"+(st?"Ana bilgisayar: <b>"+esc(st.host)+"</b><br>Çekirdek: "+esc(st.kernel):"Sistem hizmeti yok")+"</p><p>Giriş parolası: <input id='np' type='password' placeholder='yeni parola'> <button id='sp'>Kaydet</button></p><p><button id='rb'>Yeniden başlat</button> <button id='pf'>Kapat</button></p>";
      pane.querySelector("#sp").onclick=()=>{try{localStorage.setItem("zirve_pw",pane.querySelector("#np").value)}catch(e){}toast("Parola kaydedildi")};
      pane.querySelector("#rb").onclick=()=>st?api("/api/power",{act:"reboot"}):location.reload();pane.querySelector("#pf").onclick=()=>st?api("/api/power",{act:"poweroff"}):toast("Kapatma yalnızca ISO'da çalışır")};
    tab("🌐 Ağ",net).click();tab("🔊 Ses",snd);tab("☀️ Görüntü",disp);tab("💻 Sistem",sys);return}
  build0(k,b);
}
async function api(p,d){try{const r=await fetch(p,d?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)}:{});return await r.json()}catch(e){return null}}
/* hızlı ayarlar */
var ZV=.7;
(function(){
const SV={wifi:1,bt:0,air:0,eco:0,cap:0,big:0,hc:0,rm:0};
let BR=100,LV=70,MU=0,NET="ZirveOS-Ağ";
try{const s=JSON.parse(localStorage.getItem("zirveqs")||"null");if(s){Object.assign(SV,s.SV);BR=s.BR??BR;LV=s.LV??LV;MU=s.MU??0;NET=s.NET||NET}}catch(e){}
const save=()=>{try{localStorage.setItem("zirveqs",JSON.stringify({SV,BR,LV,MU,NET}))}catch(e){}};
const T=[["wifi","📶","Wi-Fi","net"],["bt","🔷","Bluetooth","bt"],["air","✈️","Uçak modu"],["acc","♿","Erişilebilirlik","acc"],["eco","🍃","Enerji tasarrufu"],["cap","💬","Canlı alt yazı"]];
const qp=$("#qp");let bat=null;
qp.innerHTML='<div id="qmain"><div class="qgrid"></div>'+
 '<div class="qsl"><button id="qb-i" title="Parlaklık">☀️</button><input id="qbr" type="range" min="20" max="100"><em id="qbv"></em></div>'+
 '<div class="qsl"><button id="qv-i" title="Sesi kapat / aç"></button><input id="qvl" type="range" min="0" max="100"><em id="qvv"></em></div>'+
 '<div id="qf"><span id="q-bat"></span><button id="q-set" title="Ayarlar">⚙️</button></div></div><div id="qsub"></div>';
qp.addEventListener("click",e=>e.stopPropagation());
const g=qp.querySelector(".qgrid");
T.forEach(([id,ic,lb,sub])=>{
  const c=document.createElement("div");c.className="qc";c.id="qc-"+id;
  c.innerHTML='<div class="qt"><button class="m">'+ic+'</button>'+(sub?'<button class="a">›</button>':'')+'</div><span></span>';
  c.querySelector(".m").onclick=()=>id==="acc"?openSub("acc"):tog(id);
  if(sub)c.querySelector(".a").onclick=()=>openSub(sub);
  g.appendChild(c)});
function tog(id){
  if(id==="air"){SV.air=SV.air?0:1;if(SV.air){SV.wifi=0;SV.bt=0}else SV.wifi=1}
  else if(id==="wifi"||id==="bt"){SV[id]=SV[id]?0:1;if(SV[id])SV.air=0}
  else SV[id]=SV[id]?0:1;
  if(id==="cap"&&SV.cap)toast("Canlı alt yazı açıldı (ses tanıma henüz bağlı değil)");
  paint();save()}
function paint(){
  const R=document.documentElement.classList;
  R.toggle("eco",!!SV.eco);R.toggle("hc",!!SV.hc);R.toggle("big",!!SV.big);R.toggle("rm",!!SV.rm);
  T.forEach(([id,,lb])=>{const c=$("#qc-"+id);
    const on=id==="acc"?(SV.big||SV.hc||SV.rm):SV[id];
    c.classList.toggle("on",!!on);
    c.querySelector("span").textContent=id==="wifi"&&SV.wifi?NET:lb});
  const eff=SV.eco?Math.min(BR,70):BR;
  $("#bright").style.opacity=((100-eff)/100*.8).toFixed(2);
  $("#qbr").value=BR;$("#qbv").textContent="%"+BR;
  ZV=MU?0:LV/100;
  $("#qvl").value=LV;$("#qvv").textContent=MU?"Sessiz":"%"+LV;
  const vi=(MU||LV==0)?"🔇":LV<40?"🔈":"🔊";$("#qv-i").textContent=vi;
  document.querySelectorAll("video,audio").forEach(m=>m.volume=ZV);
  $("#qi").textContent=(SV.air?"✈️":SV.wifi?"📶":"🚫")+" "+vi+" "+(bat&&bat.charging?"⚡":"🔋");
  paintBat()}
function paintBat(){
  $("#q-bat").textContent=bat?((bat.charging?"⚡ ":"🔋 ")+"%"+Math.round(bat.level*100)):"🔌 Güç kaynağı bağlı"}
if(navigator.getBattery)navigator.getBattery().then(b=>{bat=b;["levelchange","chargingchange"].forEach(ev=>b.addEventListener(ev,paint));paint()}).catch(()=>{});
$("#qbr").oninput=e=>{BR=+e.target.value;paint();save()};
$("#qvl").oninput=e=>{LV=+e.target.value;MU=0;paint();save();sysVol()};
$("#qv-i").onclick=()=>{MU=MU?0:1;paint();save();sysVol()};
function sysVol(){clearTimeout(window._vt);window._vt=setTimeout(()=>api("/api/volume",{v:LV,mute:!!MU}),120)}
$("#q-set").onclick=()=>{closeQ();openApp("settings")};
/* alt görünümler */
const sub=$("#qsub");
function openSub(k){if(k==="net"){closeQ();openApp("control");return}$("#qmain").style.display="none";sub.style.display="block";renderSub(k)}
function backMain(){sub.style.display="none";$("#qmain").style.display="block"}
function renderSub(k){
  const titles={net:"Wi-Fi",bt:"Bluetooth",acc:"Erişilebilirlik"};
  let h='<div class="qh"><button id="qback" title="Geri">←</button><b>'+titles[k]+'</b></div>';
  const tg=(key,txt)=>'<div class="qr" data-k="'+key+'"><span>'+txt+'</span><i class="qk '+(SV[key]?'on':'')+'"></i></div>';
  if(k==="net"){
    h+=tg("wifi","Wi-Fi");
    if(SV.wifi)["ZirveOS-Ağ","Misafir","Ev-Ağı-5G"].forEach(n=>{h+='<div class="qr" data-n="'+n+'"><span>📶 '+n+'</span><span>'+(n===NET?"✓ Bağlı":"")+'</span></div>'});
    else h+='<div class="qr dim">Wi-Fi kapalı</div>';
    h+='<div class="qr dim">Örnek ağ listesi — gerçek tarama sistem köprüsü gerektirir</div>'}
  if(k==="bt"){
    h+=tg("bt","Bluetooth");
    if(SV.bt)["Kulaklık","Klavye"].forEach(n=>{h+='<div class="qr" data-d="'+n+'"><span>🔷 '+n+'</span><span></span></div>'});
    else h+='<div class="qr dim">Bluetooth kapalı</div>';
    h+='<div class="qr dim">Örnek cihaz listesi — gerçek eşleştirme sistem köprüsü gerektirir</div>'}
  if(k==="acc"){h+=tg("big","Büyük yazı")+tg("hc","Yüksek karşıtlık")+tg("rm","Hareketi azalt")}
  sub.innerHTML=h;
  sub.querySelector("#qback").onclick=backMain;
  sub.querySelectorAll("[data-k]").forEach(r=>r.onclick=()=>{const key=r.dataset.k;
    if(key==="wifi"||key==="bt"){tog(key)}else{SV[key]=SV[key]?0:1;paint();save()}
    renderSub(k)});
  sub.querySelectorAll("[data-n]").forEach(r=>r.onclick=()=>{NET=r.dataset.n;paint();save();renderSub(k);toast(NET+" ağına bağlanıldı")});
  sub.querySelectorAll("[data-d]").forEach(r=>r.onclick=()=>toast(r.dataset.d+" bağlandı"))}
/* aç / kapat */
function openQ(){backMain();qp.classList.add("open");$("#qs").classList.add("on")}
function closeQ(){qp.classList.remove("open");$("#qs").classList.remove("on");backMain()}
$("#qs").onclick=e=>{e.stopPropagation();const o=!qp.classList.contains("open");toggleStart(false);o?openQ():closeQ()};
$("#sb").addEventListener("click",closeQ);
document.addEventListener("click",e=>{if(!e.target.closest("#qp")&&!e.target.closest("#qs"))closeQ()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeQ()});
paint();
})();

/* sağ tık menüsü + kısayollar */
document.addEventListener("contextmenu",e=>{if(!e.target.closest("#desk")||e.target.closest(".win"))return;e.preventDefault();
  document.querySelectorAll(".cm").forEach(x=>x.remove());const m=document.createElement("div");m.className="cm";
  m.style.cssText=`position:fixed;left:${e.clientX}px;top:${e.clientY}px;background:#1f2937;color:#fff;z-index:960;font-size:13px;box-shadow:0 6px 20px #000a`;
  [["🎨 Arka planı değiştir",()=>{const g=WALLS[Math.random()*WALLS.length|0][0];$("#desk").style.background=g}],["📝 Yeni not","notepad"],["⚙️ Ayarlar","settings"],["📊 Görev Yöneticisi","taskmgr"],["🔄 Yenile",()=>toast("Yenilendi")]].forEach(([t,a])=>{const i=document.createElement("div");i.textContent=t;i.style.cssText="padding:8px 16px;cursor:pointer";i.onmouseenter=()=>i.style.background="#2f3b4d";i.onmouseleave=()=>i.style.background="";i.onclick=()=>{typeof a==="string"?openApp(a):a();m.remove()};m.appendChild(i)});
  document.body.appendChild(m);document.addEventListener("click",()=>m.remove(),{once:true})});
document.addEventListener("keydown",e=>{if(e.ctrlKey&&e.shiftKey&&e.key==="Escape")openApp("taskmgr");if(e.key==="Meta")toggleStart()});

/* ZirveOS 1.2: dosya sistemi + komutlar + parola */
let FS;try{FS=JSON.parse(localStorage.getItem("zirve_fs"))}catch(e){}
if(!FS)FS={t:"d",c:{Kullanici:{t:"d",c:{Masaüstü:{t:"d",c:{"notlar.txt":{t:"f",x:"ZirveOS'a hoş geldin!"}}},Belgeler:{t:"d",c:{}},İndirilenler:{t:"d",c:{}},Resimler:{t:"d",c:{}}}}}};
function fsSave(){try{localStorage.setItem("zirve_fs",JSON.stringify(FS))}catch(e){}}
function fsGet(p){let d=FS;for(const n of p)d=d.c[n];return d}
let CWD=["Kullanici"];
function zcmd(raw){
  const [c,...r]=raw.split(/\s+/),arg=r.join(" "),d=fsGet(CWD),cl=(c||"").toLowerCase();
  if(cl==="dir"||cl==="ls")return Object.keys(d.c).map(n=>(d.c[n].t==="d"?"<DIR>  ":"       ")+n).join("\n")||"(boş)";
  if(cl==="cd"){if(arg===".."){if(CWD.length>1)CWD.pop();return "C:\\"+CWD.join("\\")}const t=d.c[arg];if(t&&t.t==="d"){CWD.push(arg);return "C:\\"+CWD.join("\\")}return "Klasör bulunamadı."}
  if(cl==="mkdir"){if(!arg||d.c[arg])return "Olmaz: ad boş ya da zaten var.";d.c[arg]={t:"d",c:{}};fsSave();return "Oluşturuldu."}
  if(cl==="cat"||cl==="type"){const f=d.c[arg];return f&&f.t==="f"?(f.x||"(boş dosya)"):"Dosya bulunamadı."}
  if(cl==="yaz"){const n=r[0],t=r.slice(1).join(" ");if(!n)return "Kullanım: yaz dosya.txt metin";if(d.c[n]&&d.c[n].t==="d")return "Bu bir klasör.";d.c[n]={t:"f",x:t};fsSave();return "Yazıldı."}
  if(cl==="sil"||cl==="del"){if(!d.c[arg])return "Bulunamadı.";delete d.c[arg];fsSave();return "Silindi."}
  if(cl==="parola"){try{localStorage.setItem("zirve_pw",arg)}catch(e){}return arg?"Parola ayarlandı.":"Parola kaldırıldı."}
  if(cl==="kilitle"){$("#login").style.display="flex";return ""}
}
document.addEventListener("keydown",e=>{if(e.metaKey&&e.key.toLowerCase()==="l"){e.preventDefault();$("#login").style.display="flex"}});
/* kurulum sihirbazı */
let inst=false;try{inst=localStorage.getItem("zirve")==="1"}catch(e){}
const SU=$("#setup");SU.querySelector("img").src=$(".mark").src;
if(inst)SU.style.display="none";
const steps=[
 {t:"ZirveOS Kurulumu",b:'<p>Kuruluma başlamadan önce tercihlerini seç.</p><label>Dil<br><select><option>Türkçe</option><option>English</option></select></label><br><label>Saat dilimi<br><select><option>(UTC+03:00) İstanbul</option></select></label><br><label>Klavye<br><select><option>Türkçe Q</option><option>US</option></select></label>',btn:"İleri"},
 {t:"Lisans koşulları",b:'<div class="lic">ZirveOS kişisel kullanım içindir. Yazılım olduğu gibi sunulur ve herhangi bir garanti verilmez. Kurulumla birlikte ZirveOS’un deneme sürümünü kullanmayı kabul etmiş olursun.</div><label><input type="checkbox" id="ok"> Lisans koşullarını kabul ediyorum</label>',btn:"İleri",chk:()=>$("#ok").checked||(toast("Devam etmek için koşulları kabul et"),false)},
 {t:"ZirveOS’u nereye kurmak istiyorsun?",b:'<label class="dk"><input type="radio" name="dk" checked> Sürücü 0 · 20,0 GB · Ayrılmamış alan</label><label class="dk"><input type="radio" name="dk"> Sürücü 1 · 64,0 GB · Birincil bölüm</label><p style="margin-top:10px;color:#9fb3c8">Seçilen sürücü biçimlendirilir.</p>',btn:"Kur"},
 {t:"ZirveOS kuruluyor",b:'<p id="su-msg"></p><div class="bar"><i id="su-bar"></i></div><span id="su-pct">0%</span>',run(){
   $("#su-next").style.display="none";let p=0;
   const m=["Dosyalar kopyalanıyor...","Özellikler yükleniyor...","Güncelleştirmeler yükleniyor...","Son ayarlar yapılıyor..."];
   const iv=setInterval(()=>{p=Math.min(100,p+2+Math.random()*3);
    $("#su-bar").style.width=p+"%";$("#su-msg").textContent=m[Math.min(3,Math.floor(p/25))];$("#su-pct").textContent=Math.floor(p)+"%";
    if(p>=100){clearInterval(iv);si++;sRender()}},200)}},
 {t:"Kurulum tamamlandı",b:'<p>ZirveOS başarıyla kuruldu. Bilgisayarın yeniden başlatılacak.</p>',btn:"Yeniden başlat",last:true}
];
let si=0;
function sRender(){const s=steps[si];$("#su-title").textContent=s.t;$("#su-body").innerHTML=s.b;
 const nx=$("#su-next");nx.style.display=s.btn?"":"none";nx.textContent=s.btn||"";if(s.run)s.run()}
$("#su-next").onclick=()=>{const s=steps[si];if(s.chk&&!s.chk())return;
 if(s.last){try{localStorage.setItem("zirve","1")}catch(e){}location.reload();return}
 si++;sRender()};
sRender();
</script>
